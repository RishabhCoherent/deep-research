<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;display=swap');
    </style>
  </defs>

  <!-- Warm off-white background -->
  <rect width="80" height="80" rx="18" fill="#FAF9F6"/>

  <!-- Glass-card border -->
  <rect width="80" height="80" rx="18" fill="none" stroke="rgba(124,58,237,0.10)" stroke-width="1"/>

  <!-- "C" lettermark in Instrument Serif -->
  <text x="16" y="58" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-weight="400" font-size="52" fill="#1C1917">C</text>

  <!-- Purple accent dot -->
  <circle cx="58" cy="52" r="5" fill="#7C3AED"/>
</svg>
